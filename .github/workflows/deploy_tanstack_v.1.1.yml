name: Deploy TanStack to Plesk

on:
  workflow_call:
    inputs:
      DEPLOY_PATH:
        required: true
        type: string
      SITE_URL:
        required: true
        type: string
      NODE_VERSION:
        required: false
        type: string
        default: '22'
    secrets:
      PLESK_HOST:
        required: true
      PLESK_USER:
        required: true
      PLESK_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify lockfile exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json fehlt im Repo-Root."
            echo "Bitte Lockfile committen, damit npm ci reproduzierbar läuft."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .output/server/index.mjs ]; then
            echo ".output/server/index.mjs wurde nicht gefunden."
            echo "Bitte prüfen, ob der TanStack-Build wie erwartet nach .output schreibt."
            exit 1
          fi

      - name: Prepare deploy package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy
          mkdir -p deploy

          cp -R .output deploy/.output

          cat > deploy/app.js <<'EOF'
          import { createServer } from 'node:http'
          import handler from './.output/server/index.mjs'

          const port = process.env.PORT || 3000

          createServer(handler).listen(port, () => {
            console.log(`Server running on port ${port}`)
          })
          EOF

          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt

      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.PLESK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PLESK_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy files to Plesk
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            deploy/ "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}:${{ inputs.DEPLOY_PATH }}/"

      - name: Restart application
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" <<EOF
            cd "${{ inputs.DEPLOY_PATH }}"
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Restart triggered."
          EOF

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsSLI "${{ inputs.SITE_URL }}"
