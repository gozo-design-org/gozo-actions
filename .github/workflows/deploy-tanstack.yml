name: Deploy TanStack to Plesk

on:
  workflow_call:
    inputs:
      DEPLOY_PATH:
        required: true
        type: string
      SITE_URL:
        required: true
        type: string

    secrets:
      PLESK_HOST:
        required: true
      PLESK_USER:
        required: true
      PLESK_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -e

          DEPLOY_PATH="${{ inputs.DEPLOY_PATH }}"
          SITE_URL="${{ inputs.SITE_URL }}"

          if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ]; then
            echo "ERROR: DEPLOY_PATH is empty or root (/)"
            exit 1
          fi

          case "$DEPLOY_PATH" in
            /var/www/vhosts/*)
              echo "DEPLOY_PATH OK: $DEPLOY_PATH"
              ;;
            *)
              echo "ERROR: DEPLOY_PATH must start with /var/www/vhosts/"
              exit 1
              ;;
          esac

          if [ -z "$SITE_URL" ]; then
            echo "ERROR: SITE_URL is empty"
            exit 1
          fi

          case "$SITE_URL" in
            https://*)
              echo "SITE_URL OK: $SITE_URL"
              ;;
            *)
              echo "ERROR: SITE_URL must start with https://"
              exit 1
              ;;
          esac

      - name: Setup SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.PLESK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -R "${{ secrets.PLESK_HOST }}" 2>/dev/null || true
          ssh-keyscan -T 10 -H "${{ secrets.PLESK_HOST }}" > ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o BatchMode=yes \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" \
            "echo SSH OK"

      - name: Validate remote deploy path
        shell: bash
        run: |
          set -e

          ssh \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" << EOF

          set -e

          DEPLOY_PATH="${{ inputs.DEPLOY_PATH }}"

          if [ -z "\$DEPLOY_PATH" ] || [ "\$DEPLOY_PATH" = "/" ]; then
            echo "ERROR: Remote DEPLOY_PATH is empty or root (/)"
            exit 1
          fi

          case "\$DEPLOY_PATH" in
            /var/www/vhosts/*)
              echo "Remote DEPLOY_PATH prefix OK"
              ;;
            *)
              echo "ERROR: Remote DEPLOY_PATH must start with /var/www/vhosts/"
              exit 1
              ;;
          esac

          if [ ! -d "\$DEPLOY_PATH" ]; then
            echo "ERROR: Remote DEPLOY_PATH does not exist: \$DEPLOY_PATH"
            exit 1
          fi

          if [ ! -w "\$DEPLOY_PATH" ]; then
            echo "ERROR: Remote DEPLOY_PATH is not writable by ${{ secrets.PLESK_USER }}"
            exit 1
          fi

          echo "Remote DEPLOY_PATH OK: \$DEPLOY_PATH"

          EOF

      - name: Upload project
        shell: bash
        run: |
          set -e

          rsync -rlz \
            --delete-after \
            --omit-dir-times \
            --no-owner \
            --no-group \
            --no-perms \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".output" \
            --exclude "dist" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude "tmp" \
            --exclude "app.js" \
            ./ \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}:${{ inputs.DEPLOY_PATH }}/"

      - name: Build on server
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" << EOF

          set -e

          export PATH=/opt/plesk/node/22/bin:\$PATH
          export NITRO_PRESET=node-server

          cd "${{ inputs.DEPLOY_PATH }}"

          echo "Node:"
          node -v
          npm -v

          test -f package.json || { echo "ERROR: package.json missing"; exit 1; }

          rm -f index.html
          rm -rf .output dist

          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

          test -f .output/server/index.mjs || { echo "ERROR: .output/server/index.mjs missing"; exit 1; }

          cat > app.js << 'APP'
          import './.output/server/index.mjs'
          APP

          chmod 644 app.js || true
          chmod -R u+rwX,go+rX .output || true

          mkdir -p tmp
          touch tmp/restart.txt

          echo "Deploy completed."

          EOF

      - name: Smoke Test
        shell: bash
        run: |
          sleep 5
          curl -fsSLI "${{ inputs.SITE_URL }}"
