name: Deploy TanStack to Plesk

on:
  workflow_call:
    inputs:
      DEPLOY_PATH:
        required: true
        type: string
      SITE_URL:
        required: true
        type: string

    secrets:
      PLESK_HOST:
        required: true
      PLESK_USER:
        required: true
      PLESK_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.PLESK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Alte Hostkeys entfernen (z.B. nach Server-Restore)
          ssh-keygen -R "${{ secrets.PLESK_HOST }}" 2>/dev/null || true

          # Aktuellen Hostkey speichern
          ssh-keyscan -T 10 -H "${{ secrets.PLESK_HOST }}" > ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o BatchMode=yes \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" \
            "echo SSH OK"

      - name: Upload project
        shell: bash
        run: |
          rsync -rlz \
            --delete \
            --omit-dir-times \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".output" \
            --exclude "dist" \
            --exclude "node_modules" \
            --exclude ".env" \
            --exclude "tmp" \
            ./ \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}:${{ inputs.DEPLOY_PATH }}/"

      - name: Build on server
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.PLESK_USER }}@${{ secrets.PLESK_HOST }}" << 'EOF'

          set -e

          export PATH=/opt/plesk/node/22/bin:$PATH

          cd "${{ inputs.DEPLOY_PATH }}"

          echo "Node:"
          node -v
          npm -v

          test -f package.json

          rm -f index.html
          rm -rf .output dist

          npm install --legacy-peer-deps --no-audit --no-fund

          npm run build

          test -f .output/server/index.mjs

          cat > app.js << 'APP'
          import './.output/server/index.mjs'
          APP

          mkdir -p tmp
          touch tmp/restart.txt

          echo "Deploy completed."

          EOF

      - name: Smoke Test
        shell: bash
        run: |
          sleep 5
          curl -fsSLI "${{ inputs.SITE_URL }}"
